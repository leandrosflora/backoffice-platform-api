# HPA on the API only, matching the reference (deploy/kubernetes/base/hpa.yaml) — the worker
# deployables scale via a fixed replica count instead, since their throughput is governed by
# the events.v1 topic's partition count (3) and outbox/timer row-claim contention, not request
# volume; CPU-based autoscaling isn't a meaningful signal for them (spec: platform-deployment).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intelligent-backoffice-api
  namespace: intelligent-backoffice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intelligent-backoffice-api
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
