---
# One Deployment per worker role (outbox dispatcher, workflow consumer, timer firing) from the
# same image, differing only in the Worker__Role env var — mirroring the three-container split
# in docker-compose.yml's distributed profile (spec: platform-deployment, task 12.1/12.3). Each
# has no Service: workers never receive inbound traffic, only the readiness/liveness HTTP
# probes hit the pod IP directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-backoffice-outbox-dispatcher
  namespace: intelligent-backoffice
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: intelligent-backoffice-outbox-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intelligent-backoffice-outbox-dispatcher
        app.kubernetes.io/part-of: intelligent-backoffice-platform
    spec:
      serviceAccountName: intelligent-backoffice-workers
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: intelligent-backoffice-outbox-dispatcher
      containers:
        - name: outbox-dispatcher
          image: ghcr.io/leandrosflora/intelligent-backoffice-platform-dotnet-workers@sha256:1111111111111111111111111111111111111111111111111111111111111111
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Worker__Role
              value: outbox-dispatcher
          envFrom:
            - configMapRef:
                name: intelligent-backoffice-config
            - secretRef:
                name: intelligent-backoffice-runtime
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
